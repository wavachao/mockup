name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # AGP would otherwise create ~/.android/debug.keystore, which fails on a read-only
      # home directory. Generating one in the workspace keeps the build hermetic.
      - name: Provide a debug keystore
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          printf 'debug.keystore=%s\n' "$KEYSTORE" >> local.properties
          cat local.properties

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Assemble release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Lint
        run: gradle :app:lintDebug --stacktrace
        continue-on-error: true

      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk -name "*.apk" -exec cp {} artifacts/ \;
          ls -lh artifacts

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: timeblock-apk-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
