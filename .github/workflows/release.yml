name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0); must already exist"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # AGP creates ~/.android/debug.keystore by default, which fails on a read-only
      # home directory. Generating one in the workspace keeps the build hermetic.
      - name: Provide a debug keystore
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          printf 'debug.keystore=%s\n' "$KEYSTORE" >> local.properties

      # The CI workflow is what gates `main` on the unit tests; this job exists to turn a
      # tag into a downloadable artifact, so it keeps building even while a test is red and
      # reports the build log either way.
      - name: Assemble release APK
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace 2>&1 | tee build.log

      - name: Publish build log
        if: always()
        run: |
          {
            echo "### Release build log (tail)"
            echo '```'
            tail -n 80 build.log 2>/dev/null || echo "no build log was produced"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rename artifact
        id: apk
        run: |
          set -euo pipefail
          VERSION="${{ github.event.inputs.tag || github.ref_name }}"
          SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          TARGET="timeblock-${VERSION}.apk"
          cp "$SOURCE" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
          ls -lh "$TARGET"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: TimeBlock ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
