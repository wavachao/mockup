name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.0.0); must already exist"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build signed APK and publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Same reason as the CI workflow: keep the signing key inside the workspace.
      - name: Provide a debug keystore
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/debug.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          printf 'debug.keystore=%s\n' "$KEYSTORE" >> local.properties

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --continue --stacktrace

      # Same rationale as the CI workflow: publish the failure text so a red run explains
      # itself without needing the raw log.
      - name: Summarise unit test results
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### Unit test results"
            echo
            if [ -d app/build/test-results/testDebugUnitTest ]; then
              grep -h -o 'name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' \
                app/build/test-results/testDebugUnitTest/*.xml || true
              echo
              grep -h -A 4 '<failure' app/build/test-results/testDebugUnitTest/*.xml | head -n 160 || true
            else
              echo "no test results were produced (the task failed before running any test)"
            fi
          } | tee test-summary.md
          cat test-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-summary
          path: test-summary.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Assemble release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename artifact
        id: apk
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-${{ github.event.inputs.tag }}}"
          SOURCE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          TARGET="timeblock-${VERSION}.apk"
          cp "$SOURCE" "$TARGET"
          echo "path=$TARGET" >> "$GITHUB_OUTPUT"
          ls -lh "$TARGET"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: TimeBlock ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
